name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the production server
        run: |
          set -euo pipefail

          log_file="$(mktemp)"
          setsid npm start > "$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill -- -"$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if health="$(curl --fail --silent --show-error http://127.0.0.1:4173/api/health)"; then
              echo "Health check passed: $health"
              exit 0
            fi
            sleep 1
          done

          echo "Server did not respond on /api/health within 30 seconds." >&2
          cat "$log_file" >&2
          exit 1
